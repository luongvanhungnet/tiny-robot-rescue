name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Export Templates & Debug Keystore
        run: |
          mkdir -p build/android
          mkdir -p "$HOME/.local/share/godot" "$HOME/.config"
          if [ ! -e "$HOME/.local/share/godot/export_templates" ] && [ -d "/root/.local/share/godot/export_templates" ]; then
            ln -s /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates"
          fi
          if [ ! -e "$HOME/.config/godot" ] && [ -d "/root/.config/godot" ]; then
            cp -r /root/.config/godot "$HOME/.config/godot"
          fi
          keytool -genkey -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import Project
        run: godot --headless --import --quit
      - name: Export Debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: godot --headless --export-debug "Android" build/android/tiny-robot-rescue-debug.apk
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tiny-robot-rescue-debug-apk
          path: build/android/tiny-robot-rescue-debug.apk
